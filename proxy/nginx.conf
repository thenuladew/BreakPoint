worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security headers applied to all responses ──────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "no-referrer"     always;

    # Hide Nginx version from error pages and headers
    server_tokens off;

    # ── Logging format ─────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    keepalive_timeout 30;

    # ── Rate limiting zones ────────────────────────────────────
    # 60 requests/minute per IP across challenge services
    limit_req_zone $binary_remote_addr zone=challenge_limit:10m rate=60r/m;
    # Tighter limit for flag submission endpoint
    limit_req_zone $binary_remote_addr zone=flag_submit:10m rate=5r/m;

    # ──────────────────────────────────────────────────────────
    # PORT 8080 – CTF Control Platform
    # ──────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Flag submission gets a strict rate limit
        location /api/submit {
            limit_req zone=flag_submit burst=2 nodelay;
            proxy_pass         http://platform:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         http://platform:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8081 – Stage 1: Ghost in the Footprint (OSINT site)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8081;
        server_name _;

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         http://stage1:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8082 – Stage 2: The Contractor Portal (IDOR app)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8082;
        server_name _;

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         http://stage2:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8084 – File Share (Stage 4 images & Stage 5 binary)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8084;
        server_name _;

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         http://fileshare:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8090 – Stage 6: SOVEREIGN Authorization (GATED)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8090;
        server_name _;

        # auth_request checks with the CTF platform whether this team
        # has completed Stage 5 AND the countdown timer is still running.
        # The platform returns 200 (allow) or 403 (deny).
        auth_request /internal/check_stage6_access;

        # Custom error for auth_request denial
        error_page 403 = @stage6_locked;
        location @stage6_locked {
            default_type application/json;
            return 403 '{"error":"Stage 6 is locked. Complete Stage 5 first.","code":"STAGE_LOCKED"}';
        }

        # The auth sub-request is proxied to the platform service
        location = /internal/check_stage6_access {
            internal;
            proxy_pass              http://platform:5000/api/check_stage6_access;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI  $request_uri;
            proxy_set_header        X-Real-IP       $remote_addr;
            proxy_set_header        X-Team-Token    $http_x_team_token;
        }

        location / {
            limit_req zone=challenge_limit burst=10 nodelay;
            proxy_pass         http://stage6:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Forward the team token so Stage 6 can use it
            proxy_set_header   X-Team-Token      $http_x_team_token;
        }
    }
}
