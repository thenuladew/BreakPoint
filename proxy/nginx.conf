worker_processes auto;
error_log  /var/log/nginx/error.log warn;
# Write PID to /tmp which is always writable by any user
pid        /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security headers applied to all responses ──────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "no-referrer"     always;

    server_tokens off;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 30;

    # Docker's internal DNS resolver.
    # Setting upstreams as variables forces Nginx to resolve them at request
    # time (not at startup), so a slow-starting container won't crash Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate limiting zones ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=challenge_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=flag_submit:10m     rate=5r/m;

    # ──────────────────────────────────────────────────────────
    # PORT 8080 – CTF Control Platform
    # ──────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        set $upstream_platform http://platform:5000;

        location /api/submit {
            limit_req zone=flag_submit burst=2 nodelay;
            proxy_pass         $upstream_platform;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         $upstream_platform;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8081 – Stage 1: Ghost in the Footprint (OSINT site)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8081;
        server_name _;

        set $upstream_stage1 http://stage1:80;

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         $upstream_stage1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8082 – Stage 2: The Contractor Portal (IDOR app)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8082;
        server_name _;

        set $upstream_stage2 http://stage2:5000;

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         $upstream_stage2;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8084 – File Share (Stage 4 images & Stage 5 binary)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8084;
        server_name _;

        set $upstream_fileshare http://fileshare:80;

        location / {
            limit_req zone=challenge_limit burst=20 nodelay;
            proxy_pass         $upstream_fileshare;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }

    # ──────────────────────────────────────────────────────────
    # PORT 8090 – Stage 6: SOVEREIGN Authorization (UNLOCKED)
    # ──────────────────────────────────────────────────────────
    server {
        listen 8090;
        server_name _;

        set $upstream_stage6    http://stage6:5000;

        location / {
            limit_req zone=challenge_limit burst=10 nodelay;
            proxy_pass         $upstream_stage6;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}

