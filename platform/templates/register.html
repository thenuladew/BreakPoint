{% extends "base.html" %}
{% block title %}Provision – SOVEREIGN{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-title">SOVEREIGN : PROVISION ACCESS</div>
    <div class="auth-desc">Register a new investigator profile.</div>
    
    <form method="POST">
      <input type="text" name="team_name" class="auth-input" placeholder="Investigator / Team Alias" required autocomplete="off" spellcheck="false" maxlength="40" />
      <button type="submit" class="auth-btn">PROVISION</button>
    </form>
    
    {% if error %}
      <div class="auth-error">Error: {{ error }}</div>
    {% endif %}

    <div style="margin-top: 16px; font-size: 11px; text-align: center;">
      <a href="/login" style="color:var(--text-dim)">[ RETURN TO AUTHENTICATION ]</a>
    </div>
  </div>
</div>
{% endblock %}
