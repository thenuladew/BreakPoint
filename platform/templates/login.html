{% extends "base.html" %}
{% block title %}BREAKPOINT // Login{% endblock %}
{% block content %}
<div class="form-page">
  <h2>// RESTORE SESSION //</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="POST" action="/login" class="ctf-form">
    <label for="token">Team Token</label>
    <input type="text" id="token" name="token"
           placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
           pattern="[0-9a-f\-]{36}" required autofocus />
    <button type="submit" class="btn btn-primary">RECONNECT</button>
  </form>
  <p class="form-alt">New team? <a href="/register">Deploy →</a></p>
</div>
{% endblock %}
